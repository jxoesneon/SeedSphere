version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  # Dart/Flutter (Router & Gardener)
  - package-ecosystem: "pub"
    directory: "/router"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-router)"

  - package-ecosystem: "pub"
    directory: "/gardener"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-gardener)"

  # NPM (Bridge)
  - package-ecosystem: "npm"
    directory: "/bridge"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-bridge)"
    groups:
      bridge-dependencies:
        patterns:
          - "*"

  # NPM (Legacy)
  - package-ecosystem: "npm"
    directory: "/legacy"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps-legacy)"
    groups:
      legacy-dependencies:
        patterns:
          - "*"
